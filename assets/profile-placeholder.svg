<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid lines -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Developer Avatar Silhouette -->
  <!-- Outer Glow -->
  <circle cx="200" cy="165" r="62" fill="url(#glowGrad)"/>
  
  <!-- Head -->
  <circle cx="200" cy="165" r="54" fill="#334155"/>
  <circle cx="200" cy="165" r="50" fill="#475569"/>
  
  <!-- Shoulders / Body -->
  <path d="M100 330 C100 250, 140 240, 200 240 C260 240, 300 250, 300 330 Z" fill="#334155"/>
  <path d="M110 330 C110 260, 145 250, 200 250 C255 250, 290 260, 290 330 Z" fill="#1e293b"/>
  
  <!-- Stylized Monogram Overlay -->
  <rect x="155" y="135" width="90" height="60" rx="12" fill="url(#accentGrad)"/>
  <text x="200" y="177" font-family="'Inter', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">JK</text>
  
  <!-- Code bracket accents -->
  <text x="70" y="170" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700" fill="#f97316" opacity="0.4">&lt;</text>
  <text x="310" y="170" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700" fill="#f97316" opacity="0.4">&gt;</text>
</svg>
